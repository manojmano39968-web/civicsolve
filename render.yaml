# CivicSolve Render Deployment Blueprint
# Free-tier compatible public deployment configuration

databases:
  - name: civicsolve-db
    databaseName: civicsolve
    user: civicsolve_user
    plan: free
    region: oregon

services:
  # 1. AI Matching & NLP Microservice (Python 3.12 / FastAPI)
  # Communicates with backend over Render private networking (port 8000/10000)
  - type: web
    name: civicsolve-ai
    runtime: python
    rootDir: ai-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

  # 2. REST API Backend (Node.js / Express)
  # Public HTTPS Web Service with dynamic PORT, managed PostgreSQL, and private AI connectivity
  - type: web
    name: civicsolve-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicsolve-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: civicsolve-ai
          property: hostport

  # 3. Web Application Frontend (React 18 / Vite / Tailwind)
  # CDN-hosted Static Site using the backend's public external HTTPS URL during build
  - type: web
    name: civicsolve-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: civicsolve-backend
          envVarKey: RENDER_EXTERNAL_URL
