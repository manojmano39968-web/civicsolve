services:
  postgres:
    image: postgres:16-alpine
    container_name: civicsolve-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: civicsolve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  pgdata:
